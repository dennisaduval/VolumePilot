name: .NET

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore VolumePilot.sln
      - name: Build
        run: dotnet build VolumePilot.sln --configuration Release --no-restore
      - name: Test application
        run: dotnet test VolumePilot.sln --configuration Release --no-build
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Verify SQLite schema
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Scaffold HQ migration for review
        if: github.head_ref == 'hq/postgres-schema-migrations'
        shell: pwsh
        run: |
          dotnet tool install dotnet-ef --tool-path .tools --version 10.0.12
          .\.tools\dotnet-ef.exe migrations add InitialHqSchema --project apps/VolumePilot.HQ.Api/VolumePilot.HQ.Api.csproj --startup-project apps/VolumePilot.HQ.Api/VolumePilot.HQ.Api.csproj --context HqDbContext --output-dir Persistence/Migrations --no-build
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'hq/postgres-schema-migrations'
        with:
          name: hq-postgres-migration-scaffold
          path: apps/VolumePilot.HQ.Api/Persistence/Migrations
