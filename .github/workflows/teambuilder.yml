name: Pilot TeamBuilder
on:
  push:
    paths: ['apps/PilotTeamBuilder/**', '.github/workflows/teambuilder.yml']
  pull_request:
    paths: ['apps/PilotTeamBuilder/**', '.github/workflows/teambuilder.yml']
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/PilotTeamBuilder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
