name: HQ web

on:
  push:
    branches: [main]
    paths:
      - 'apps/VolumePilot.HQ.Web/**'
      - '.github/workflows/hq-web.yml'
  pull_request:
    paths:
      - 'apps/VolumePilot.HQ.Web/**'
      - '.github/workflows/hq-web.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/VolumePilot.HQ.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/VolumePilot.HQ.Web/package-lock.json
      - run: npm ci
      - run: npm run build
